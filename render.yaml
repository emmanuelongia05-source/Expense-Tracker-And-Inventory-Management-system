services:
  - type: web
    name: ledgerly
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: ledgerly
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 22